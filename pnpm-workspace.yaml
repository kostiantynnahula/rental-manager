packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts by default; allow only what we need.
allowBuilds:
  sharp: false
  unrs-resolver: false
  '@scarf/scarf': false # swagger-ui-dist telemetry
  '@prisma/engines': true # downloads the migration engine
  prisma: true
  esbuild: true # used by tsx (seed runner)
  argon2: true # native module; install only picks a prebuilt binary
  msgpackr-extract: false # optional native speedup for msgpackr (bullmq); the JS fallback is enough
